<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- 页面的图标：八边形的八卦围着太极，底下垫一块白色的八边形，深色的标签栏上也看得清。
     2026-11-17 用户要的：先画了一个「八」字，用户说不好看，要八卦；又给了一张常见的八卦图说「用这种」：
     八边形的轮廓，每一卦的三道爻顺着八边形排成梯形，中间一个大的太极。
     颜色：先用页面的钴蓝，用户说「不要用蓝色吧。用点明快的颜色」；换成朱砂红以后又让换，看了七种配色选了五行五色：
     每一卦照它的五行上色，乾、兑属金，坤、艮属土，震、巽属木，坎属水，离属火（《梅花易数》卷一「八宫所属五行」），
     五种颜色比页面里五行的颜色亮一档，太极是墨色。
     八卦照先天八卦排：乾在上、坤在下、离在左、坎在右，兑、震在左上、左下，巽、艮在右上、右下；每一卦靠里的是初爻，
     相对的两卦阴阳正好相反（《说卦传》「天地定位，山泽通气，雷风相薄，水火不相射」）。检查脚本核对这八卦的排法和配色。
     构建时由 tools/build.py 内联进页面；改了以后先跑 tools/gen_icon.py 重新生成两张 PNG -->
